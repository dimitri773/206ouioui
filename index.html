<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suivi Voiture</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 { text-align: center; color: var(--accent); }
    .card {
      background: var(--card);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
    }
    label { display: block; margin-top: 10px; color: var(--muted); font-size: 0.9rem; }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 4px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: var(--text);
      box-sizing: border-box;
    }
    button {
      width: 100%;
      background: var(--accent);
      color: #0f172a;
      font-weight: bold;
      padding: 12px;
      border: none;
      border-radius: 6px;
      margin-top: 15px;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    ul { list-style: none; padding: 0; }
    li {
      background: var(--card);
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      border-left: 4px solid var(--accent);
    }
    .date { font-size: 0.8rem; color: var(--muted); }
  </style>
</head>
<body>

  <h1>Suivi Voiture</h1>

  <div class="card">
    <form id="carForm">
      <label for="km">Kilométrage (km)</label>
      <input type="number" id="km" step="0.1" placeholder="ex: 124500" required />

      <label for="montant">Montant (€)</label>
      <input type="number" id="montant" step="0.01" placeholder="ex: 65.50" required />

      <label for="note">Note / Motif (Optionnel)</label>
      <input type="text" id="note" placeholder="ex: Plein d'essence" />

      <button type="submit">Enregistrer</button>
    </form>
  </div>

  <h2>Historique</h2>
  <ul id="logList"></ul>

  <script>
    // Configuration Supabase (Remplace avec tes identifiants Supabase)
    const SUPABASE_URL = 'https://TON_PROJET.supabase.co';
    const SUPABASE_KEY = 'TON_ANON_KEY';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById('carForm');
    const logList = document.getElementById('logList');

    async function fetchLogs() {
      const { data, error } = await supabase
        .from('trajets')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) return console.error(error);

      logList.innerHTML = data.map(entry => `
        <li>
          <div>
            <strong>${entry.km} km</strong> - ${entry.montant} €
            ${entry.note ? `<br><small style="color:#94a3b8">${entry.note}</small>` : ''}
          </div>
          <div class="date">${new Date(entry.created_at).toLocaleDateString('fr-FR')}</div>
        </li>
      `).join('');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const km = document.getElementById('km').value;
      const montant = document.getElementById('montant').value;
      const note = document.getElementById('note').value;

      const { error } = await supabase
        .from('trajets')
        .insert([{ km, montant, note }]);

      if (error) {
        alert("Erreur lors de l'enregistrement");
        console.error(error);
      } else {
        form.reset();
        fetchLogs();
      }
    });

    fetchLogs();
  </script>
</body>
</html>
