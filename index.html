<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionnaire de Factures Synchronisé</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --input: #334155;
            --text: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --danger: #ef4444;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 20px; }

        .card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); }
        h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
        p.sub { color: var(--text-sub); font-size: 0.85rem; margin-bottom: 16px; }

        .login-box { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px; }
        @media (max-width: 600px) { .login-box { grid-template-columns: 1fr; } }
        
        select, input { background: var(--input); border: 1px solid rgba(255,255,255,0.1); padding: 10px 14px; border-radius: 6px; color: #fff; font-size: 0.9rem; outline: none; }
        select:focus, input:focus { border-color: var(--accent); }

        .btn { background: var(--accent); color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
        .btn:hover { background: var(--accent-hover); }

        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .stat-card { background: var(--card); padding: 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); }
        .stat-val { font-size: 1.4rem; font-weight: 700; color: var(--success); margin-top: 4px; }
        .stat-label { font-size: 0.75rem; color: var(--text-sub); text-transform: uppercase; font-weight: 600; }

        form { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 10px; }
        @media (max-width: 600px) { form { grid-template-columns: 1fr; } }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.9rem; }
        th { color: var(--text-sub); font-size: 0.75rem; text-transform: uppercase; }

        .btn-del { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
        .btn-del:hover { background: var(--danger); color: white; }

        .status-badge { font-size: 0.8rem; padding: 4px 8px; border-radius: 4px; display: inline-block; margin-top: 10px; }
        .status-ok { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .status-err { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        
        #appContent { display: none; flex-direction: column; gap: 20px; }
    </style>
</head>
<body>

<div class="container">
    <!-- Écran de connexion -->
    <div class="card">
        <h1><i class="fa-solid fa-lock" style="color: var(--accent);"></i> Connexion Compte</h1>
        <p class="sub">Sélectionne un profil pour charger sa base de données.</p>
        
        <div class="login-box">
            <select id="selectCompte">
                <!-- Généré dynamiquement -->
            </select>
            <input type="password" id="inputPass" placeholder="Mot de passe">
            <button class="btn" id="btnLogin"><i class="fa-solid fa-right-to-bracket"></i> Connexion</button>
        </div>
        <div id="statusMsg"></div>
    </div>

    <!-- Interface des factures -->
    <div id="appContent">
        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Total Dépenses</div>
                <div class="stat-val" id="totalPrix">0.00 €</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Dernier Kilométrage</div>
                <div class="stat-val" id="dernierKm" style="color: #3b82f6;">0.0 km</div>
            </div>
        </div>

        <div class="card">
            <form id="factureForm" style="margin-bottom: 20px;">
                <input type="text" id="libelle" placeholder="Libellé / Description" required>
                <input type="number" id="montant" placeholder="Prix (€)" step="0.01" required>
                <input type="number" id="km" placeholder="Km au compteur" step="0.1" required>
                <button type="submit" class="btn"><i class="fa-solid fa-plus"></i> Ajouter</button>
            </form>

            <table>
                <thead>
                    <tr>
                        <th>Facture</th>
                        <th>Prix</th>
                        <th>Kilométrage</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="tableauBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // -------------------------------------------------------------
    // 1. COMPTES & MOTS DE PASSE (Modifiables dans le code)
    // -------------------------------------------------------------
    const COMPTES = [
        { nom: "Compte 1", pass: "1234" },
        { nom: "Compte 2", pass: "5678" }
    ];

    // -------------------------------------------------------------
    // 2. CONFIGURATION DE LA BDD CLOUD (Supabase)
    // Remplace les valeurs ci-dessous avec ton projet Supabase
    // -------------------------------------------------------------
    const SUPABASE_URL = "https://TON_PROJET.supabase.co";
    const SUPABASE_KEY = "TA_CLE_ANON_PUBLIC";
    
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let compteActuel = null;
    let factures = [];

    // Initialisation du menu déroulant
    const select = document.getElementById('selectCompte');
    COMPTES.forEach((c, index) => {
        const opt = document.createElement('option');
        opt.value = index;
        opt.textContent = c.nom;
        select.appendChild(opt);
    });

    // Connexion
    document.getElementById('btnLogin').addEventListener('click', async () => {
        const selected = COMPTES[select.value];
        const passEntered = document.getElementById('inputPass').value;
        const statusMsg = document.getElementById('statusMsg');

        if (passEntered === selected.pass) {
            compteActuel = selected.nom;
            statusMsg.innerHTML = `<span class="status-badge status-ok"><i class="fa-solid fa-check"></i> Connecté à ${compteActuel}</span>`;
            document.getElementById('appContent').style.display = 'flex';
            
            // Chargement initial des factures
            await chargerFactures();
            
            // Écoute en temps réel : synchronise instantanément entre appareils
            db.channel('realtime_factures')
              .on('postgres_changes', { event: '*', schema: 'public', table: 'factures' }, payload => {
                  chargerFactures();
              })
              .subscribe();

        } else {
            statusMsg.innerHTML = `<span class="status-badge status-err"><i class="fa-solid fa-xmark"></i> Mot de passe incorrect</span>`;
        }
    });

    // Charger les données depuis la base distante
    async function chargerFactures() {
        const { data, error } = await db
            .from('factures')
            .select('*')
            .eq('compte', compteActuel)
            .order('created_at', { ascending: true });

        if (!error && data) {
            factures = data;
            afficher();
        }
    }

    // Afficher les factures dans le DOM
    function afficher() {
        const body = document.getElementById('tableauBody');
        body.innerHTML = '';
        let total = 0;

        factures.forEach(f => {
            total += parseFloat(f.montant) || 0;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${f.libelle}</td>
                <td style="color:var(--success); font-weight:600;">${parseFloat(f.montant).toFixed(2)} €</td>
                <td>${parseFloat(f.km).toFixed(1)} km</td>
                <td><button class="btn-del" onclick="supprimer('${f.id}')"><i class="fa-solid fa-trash"></i></button></td>
            `;
            body.appendChild(tr);
        });

        document.getElementById('totalPrix').textContent = total.toFixed(2) + " €";
        
        if (factures.length > 0) {
            const dernierKmVal = parseFloat(factures[factures.length - 1].km) || 0;
            document.getElementById('dernierKm').textContent = dernierKmVal.toFixed(1) + " km";
        } else {
            document.getElementById('dernierKm').textContent = "0.0 km";
        }
    }

    // Ajouter une facture dans la BDD
    document.getElementById('factureForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const nouvelleFacture = {
            compte: compteActuel,
            libelle: document.getElementById('libelle').value,
            montant: parseFloat(document.getElementById('montant').value),
            km: parseFloat(document.getElementById('km').value)
        };

        const { error } = await db.from('factures').insert([nouvelleFacture]);
        if (!error) {
            e.target.reset();
            await chargerFactures();
        }
    });

    // Supprimer une facture de la BDD
    async function supprimer(id) {
        const { error } = await db.from('factures').delete().eq('id', id);
        if (!error) {
            await chargerFactures();
        }
    }
</script>

</body>
</html>
