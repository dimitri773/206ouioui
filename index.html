<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionnaire de Factures Sécurisé</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --input: #334155;
            --text: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --danger: #ef4444;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 20px; }

        .card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); }
        h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
        p.sub { color: var(--text-sub); font-size: 0.85rem; margin-bottom: 16px; }

        .sync-box { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px; margin-bottom: 10px; }
        @media (max-width: 600px) { .sync-box { grid-template-columns: 1fr; } }
        
        form { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 10px; }
        @media (max-width: 600px) { form { grid-template-columns: 1fr; } }

        input { background: var(--input); border: 1px solid rgba(255,255,255,0.1); padding: 10px 14px; border-radius: 6px; color: #fff; font-size: 0.9rem; outline: none; }
        input:focus { border-color: var(--accent); }

        .btn { background: var(--accent); color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
        .btn:hover { background: var(--accent-hover); }

        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .stat-card { background: var(--card); padding: 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); }
        .stat-val { font-size: 1.4rem; font-weight: 700; color: var(--success); margin-top: 4px; }
        .stat-label { font-size: 0.75rem; color: var(--text-sub); text-transform: uppercase; font-weight: 600; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.9rem; }
        th { color: var(--text-sub); font-size: 0.75rem; text-transform: uppercase; }

        .btn-del { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
        .btn-del:hover { background: var(--danger); color: white; }

        .status-badge { font-size: 0.8rem; padding: 4px 8px; border-radius: 4px; display: inline-block; margin-top: 5px; }
        .status-ok { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .status-err { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1><i class="fa-solid fa-lock" style="color: var(--accent);"></i> Espace Sécurisé</h1>
        <p class="sub">Choisissez un mot clé (ex: monespace) et un mot de passe pour synchroniser vos données.</p>
        
        <div class="sync-box">
            <input type="text" id="spaceKey" placeholder="Nom d'espace (ex: monespace)">
            <input type="password" id="spacePass" placeholder="Mot de passe secret">
            <button class="btn" id="btnSync"><i class="fa-solid fa-key"></i> Connexion</button>
        </div>
        <div id="statusMsg"></div>
    </div>

    <div class="stats">
        <div class="stat-card">
            <div class="stat-label">Total Dépenses</div>
            <div class="stat-val" id="totalPrix">0.00 €</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Dernier Kilométrage</div>
            <div class="stat-val" id="dernierKm" style="color: #3b82f6;">0.0 km</div>
        </div>
    </div>

    <div class="card">
        <form id="factureForm" style="margin-bottom: 20px;">
            <input type="text" id="libelle" placeholder="Libellé / Description" required>
            <input type="number" id="montant" placeholder="Prix (€)" step="0.01" required>
            <input type="number" id="km" placeholder="Distance / Km au compteur" step="0.1" required>
            <button type="submit" class="btn"><i class="fa-solid fa-plus"></i> Ajouter</button>
        </form>

        <table>
            <thead>
                <tr>
                    <th>Facture</th>
                    <th>Prix</th>
                    <th>Kilométrage</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="tableauBody"></tbody>
        </table>
    </div>
</div>

<script>
    let factures = [];

    let currentKey = localStorage.getItem('inv_key') || 'monespace';
    let currentPass = localStorage.getItem('inv_pass') || '1234';

    document.getElementById('spaceKey').value = currentKey;
    document.getElementById('spacePass').value = currentPass;

    function cleanKey(str) {
        return str.toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    function chiffrer(data, secret) {
        return CryptoJS.AES.encrypt(JSON.stringify(data), secret).toString();
    }

    function dechiffrer(ciphertext, secret) {
        try {
            const bytes = CryptoJS.AES.decrypt(ciphertext, secret);
            const decryptedData = bytes.toString(CryptoJS.enc.Utf8);
            return decryptedData ? JSON.parse(decryptedData) : null;
        } catch (e) {
            return null;
        }
    }

    // Hash simple du nom d'espace pour créer un identifiant unique
    function hashKey(key) {
        return CryptoJS.MD5("my_invoice_prefix_" + key).toString();
    }

    async function chargerDonnees() {
        const inputKey = document.getElementById('spaceKey').value.trim();
        const inputPass = document.getElementById('spacePass').value.trim();

        if (!inputKey || !inputPass) {
            document.getElementById('statusMsg').innerHTML = `<span class="status-badge status-err">Remplissez le nom d'espace ET le mot de passe</span>`;
            return;
        }

        currentKey = cleanKey(inputKey);
        currentPass = inputPass;

        localStorage.setItem('inv_key', currentKey);
        localStorage.setItem('inv_pass', currentPass);

        const statusMsg = document.getElementById('statusMsg');
        statusMsg.innerHTML = `<span class="status-badge" style="background:rgba(255,255,255,0.1)">Chargement en cours...</span>`;

        const blobId = hashKey(currentKey);

        try {
            const res = await fetch(`https://kvdb.io/4y91pYpW9M4mN9L4v5g4mX/${blobId}`);
            if (res.ok) {
                const data = await res.json();
                if (data && data.payload) {
                    const facturesDechiffrees = dechiffrer(data.payload, currentPass);
                    if (facturesDechiffrees !== null) {
                        factures = facturesDechiffrees;
                        statusMsg.innerHTML = `<span class="status-badge status-ok"><i class="fa-solid fa-lock-open"></i> Connecté à "${currentKey}"</span>`;
                    } else {
                        factures = [];
                        statusMsg.innerHTML = `<span class="status-badge status-err"><i class="fa-solid fa-triangle-exclamation"></i> Mot de passe incorrect !</span>`;
                    }
                } else {
                    factures = [];
                    statusMsg.innerHTML = `<span class="status-badge status-ok"><i class="fa-solid fa-plus"></i> Nouvel espace initialisé</span>`;
                }
            } else {
                factures = [];
                statusMsg.innerHTML = `<span class="status-badge status-ok"><i class="fa-solid fa-plus"></i> Nouvel espace initialisé</span>`;
            }
        } catch (e) {
            // Mode fallback local en cas de problème réseau
            const localData = localStorage.getItem(`local_${currentKey}`);
            if (localData) {
                const facturesDechiffrees = dechiffrer(localData, currentPass);
                if (facturesDechiffrees !== null) factures = facturesDechiffrees;
            }
            statusMsg.innerHTML = `<span class="status-badge status-ok"><i class="fa-solid fa-check"></i> Espace prêt (mode local)</span>`;
        }
        afficher();
    }

    async function sauvegarder() {
        afficher();
        const statusMsg = document.getElementById('statusMsg');
        const blobId = hashKey(currentKey);

        try {
            const payloadChiffre = chiffrer(factures, currentPass);

            // Sauvegarde locale
            localStorage.setItem(`local_${currentKey}`, payloadChiffre);

            // Sauvegarde cloud
            const res = await fetch(`https://kvdb.io/4y91pYpW9M4mN9L4v5g4mX/${blobId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ payload: payloadChiffre })
            });

            if (res.ok) {
                statusMsg.innerHTML = `<span class="status-badge status-ok"><i class="fa-solid fa-check"></i> Enregistré & Synchronisé !</span>`;
            } else {
                statusMsg.innerHTML = `<span class="status-badge status-ok"><i class="fa-solid fa-check"></i> Enregistré en local</span>`;
            }
        } catch (e) {
            statusMsg.innerHTML = `<span class="status-badge status-ok"><i class="fa-solid fa-check"></i> Enregistré en local</span>`;
        }
    }

    function afficher() {
        const body = document.getElementById('tableauBody');
        body.innerHTML = '';
        let totalP = 0;

        factures.forEach((f, index) => {
            totalP += parseFloat(f.montant) || 0;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${f.libelle}</td>
                <td style="color:var(--success); font-weight:600;">${parseFloat(f.montant).toFixed(2)} €</td>
                <td>${parseFloat(f.km).toFixed(1)} km</td>
                <td><button class="btn-del" onclick="supprimer(${index})"><i class="fa-solid fa-trash"></i></button></td>
            `;
            body.appendChild(tr);
        });

        document.getElementById('totalPrix').textContent = totalP.toFixed(2) + " €";

        if (factures.length > 0) {
            const derniereFacture = factures[factures.length - 1];
            const dernierKmVal = parseFloat(derniereFacture.km) || 0;
            document.getElementById('dernierKm').textContent = dernierKmVal.toFixed(1) + " km";
        } else {
            document.getElementById('dernierKm').textContent = "0.0 km";
        }
    }

    document.getElementById('factureForm').addEventListener('submit', (e) => {
        e.preventDefault();
        factures.push({
            libelle: document.getElementById('libelle').value,
            montant: document.getElementById('montant').value,
            km: document.getElementById('km').value
        });
        sauvegarder();
        e.target.reset();
    });

    function supprimer(index) {
        factures.splice(index, 1);
        sauvegarder();
    }

    document.getElementById('btnSync').addEventListener('click', chargerDonnees);
    
    chargerDonnees();
</script>

</body>
</html>
