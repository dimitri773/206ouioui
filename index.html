<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionnaire de Factures (Cloud)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --input: #334155; --text: #f8fafc; --text-sub: #94a3b8; --accent: #6366f1; --danger: #ef4444; --success: #10b981; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 20px; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); }
        h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 6px; }
        p.sub { color: var(--text-sub); font-size: 0.85rem; margin-bottom: 16px; }
        .sync-box { display: flex; gap: 10px; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px; margin-bottom: 10px; }
        form { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 10px; }
        @media (max-width: 600px) { form { grid-template-columns: 1fr; } }
        input { background: var(--input); border: 1px solid rgba(255,255,255,0.1); padding: 10px; border-radius: 6px; color: #fff; outline: none; }
        .btn { background: var(--accent); color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .stat-card { background: var(--card); padding: 16px; border-radius: 10px; }
        .stat-val { font-size: 1.4rem; font-weight: 700; color: var(--success); margin-top: 4px; }
        .stat-label { font-size: 0.75rem; color: var(--text-sub); text-transform: uppercase; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .btn-del { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1><i class="fa-solid fa-cloud-arrow-up"></i> Factures Synchronisées</h1>
        <p class="sub">Toute personne utilisant ce mot clé verra les mêmes données en direct.</p>
        <div class="sync-box">
            <input type="text" id="spaceKey" placeholder="Ex: garage-2026" style="flex:1;">
            <button class="btn" id="btnSync"><i class="fa-solid fa-right-to-bracket"></i> Rejoindre</button>
        </div>
    </div>

    <div class="stats">
        <div class="stat-card">
            <div class="stat-label">Total Dépenses</div>
            <div class="stat-val" id="totalPrix">0.00 €</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Dernier Kilométrage</div>
            <div class="stat-val" id="dernierKm" style="color: #3b82f6;">0.0 km</div>
        </div>
    </div>

    <div class="card">
        <form id="factureForm" style="margin-bottom: 20px;">
            <input type="text" id="libelle" placeholder="Libellé / Description" required>
            <input type="number" id="montant" placeholder="Prix (€)" step="0.01" required>
            <input type="number" id="km" placeholder="Km au compteur" step="0.1" required>
            <button type="submit" class="btn"><i class="fa-solid fa-plus"></i> Ajouter</button>
        </form>

        <table>
            <thead><tr><th>Facture</th><th>Prix</th><th>Kilométrage</th><th>Action</th></tr></thead>
            <tbody id="tableauBody"></tbody>
        </table>
    </div>
</div>

<script type="module">
    // Importation de Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 🔴 REMPLACE PAR TES CLÉS FIREBASE ICI 🔴
    const firebaseConfig = {
        apiKey: "VOTRE_API_KEY",
        authDomain: "VOTRE_PROJECT_ID.firebaseapp.com",
        projectId: "VOTRE_PROJECT_ID",
        storageBucket: "VOTRE_PROJECT_ID.appspot.com",
        messagingSenderId: "VOTRE_SENDER_ID",
        appId: "VOTRE_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let factures = [];
    let currentKey = localStorage.getItem('invoice_space_key') || 'espace-test';
    document.getElementById('spaceKey').value = currentKey;
    let unsubscribe = null;

    function chargerDonnees() {
        currentKey = document.getElementById('spaceKey').value.trim();
        if (!currentKey) return;
        localStorage.setItem('invoice_space_key', currentKey);
        
        if (unsubscribe) unsubscribe(); // Coupe l'ancienne connexion si on change de mot clé

        // Écoute en temps réel du document qui porte le nom du mot clé
        unsubscribe = onSnapshot(doc(db, "espaces", currentKey), (docSnap) => {
            if (docSnap.exists()) {
                factures = docSnap.data().liste || [];
            } else {
                factures = [];
            }
            afficher();
        });
    }

    async function sauvegarder() {
        await setDoc(doc(db, "espaces", currentKey), { liste: factures });
    }

    function afficher() {
        const body = document.getElementById('tableauBody');
        body.innerHTML = '';
        let totalP = 0;

        factures.forEach((f, index) => {
            totalP += parseFloat(f.montant) || 0;
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${f.libelle}</td>
                <td style="color:var(--success); font-weight:600;">${parseFloat(f.montant).toFixed(2)} €</td>
                <td>${parseFloat(f.km).toFixed(1)} km</td>
                <td><button class="btn-del" data-index="${index}"><i class="fa-solid fa-trash"></i></button></td>
            `;
            body.appendChild(tr);
        });

        document.getElementById('totalPrix').textContent = totalP.toFixed(2) + " €";
        document.getElementById('dernierKm').textContent = factures.length > 0 ? (parseFloat(factures[factures.length - 1].km) || 0).toFixed(1) + " km" : "0.0 km";

        document.querySelectorAll('.btn-del').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const index = e.currentTarget.getAttribute('data-index');
                factures.splice(index, 1);
                sauvegarder();
            });
        });
    }

    document.getElementById('factureForm').addEventListener('submit', (e) => {
        e.preventDefault();
        factures.push({
            libelle: document.getElementById('libelle').value,
            montant: document.getElementById('montant').value,
            km: document.getElementById('km').value
        });
        sauvegarder();
        e.target.reset();
    });

    document.getElementById('btnSync').addEventListener('click', chargerDonnees);
    
    // Chargement auto au démarrage
    chargerDonnees();
</script>
</body>
</html>
