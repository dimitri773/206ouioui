<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionnaire de Factures</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --input: #334155;
            --text: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --danger: #ef4444;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 20px; }

        .card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); }
        h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
        p.sub { color: var(--text-sub); font-size: 0.85rem; margin-bottom: 16px; }

        .login-box { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px; }
        @media (max-width: 600px) { .login-box { grid-template-columns: 1fr; } }
        
        select, input { background: var(--input); border: 1px solid rgba(255,255,255,0.1); padding: 10px 14px; border-radius: 6px; color: #fff; font-size: 0.9rem; outline: none; }
        select:focus, input:focus { border-color: var(--accent); }

        .btn { background: var(--accent); color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
        .btn:hover { background: var(--accent-hover); }

        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .stat-card { background: var(--card); padding: 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); }
        .stat-val { font-size: 1.4rem; font-weight: 700; color: var(--success); margin-top: 4px; }
        .stat-label { font-size: 0.75rem; color: var(--text-sub); text-transform: uppercase; font-weight: 600; }

        form { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 10px; }
        @media (max-width: 600px) { form { grid-template-columns: 1fr; } }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.9rem; }
        th { color: var(--text-sub); font-size: 0.75rem; text-transform: uppercase; }

        .btn-del { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
        .btn-del:hover { background: var(--danger); color: white; }

        .status-badge { font-size: 0.8rem; padding: 4px 8px; border-radius: 4px; display: inline-block; margin-top: 10px; }
        .status-ok { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .status-err { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        
        #appContent { display: none; flex-direction: column; gap: 20px; }
    </style>
</head>
<body>

<div class="container">
    <!-- Espace Connexion -->
    <div class="card">
        <h1><i class="fa-solid fa-lock" style="color: var(--accent);"></i> Connexion Compte</h1>
        <p class="sub">Sélectionne un utilisateur et entre ton mot de passe.</p>
        
        <div class="login-box">
            <select id="selectCompte">
                <!-- Les comptes s'affichent automatiquement ici -->
            </select>
            <input type="password" id="inputPass" placeholder="Mot de passe">
            <button class="btn" id="btnLogin"><i class="fa-solid fa-right-to-bracket"></i> Se connecter</button>
        </div>
        <div id="statusMsg"></div>
    </div>

    <!-- Application (masquée avant connexion) -->
    <div id="appContent">
        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Total Dépenses</div>
                <div class="stat-val" id="totalPrix">0.00 €</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Dernier Kilométrage</div>
                <div class="stat-val" id="dernierKm" style="color: #3b82f6;">0.0 km</div>
            </div>
        </div>

        <div class="card">
            <form id="factureForm" style="margin-bottom: 20px;">
                <input type="text" id="libelle" placeholder="Libellé / Description" required>
                <input type="number" id="montant" placeholder="Prix (€)" step="0.01" required>
                <input type="number" id="km" placeholder="Distance / Km au compteur" step="0.1" required>
                <button type="submit" class="btn"><i class="fa-solid fa-plus"></i> Ajouter</button>
            </form>

            <table>
                <thead>
                    <tr>
                        <th>Facture</th>
                        <th>Prix</th>
                        <th>Kilométrage</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="tableauBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // -------------------------------------------------------------
    // CONFIGURATION DES COMPTES ET MOTS DE PASSE (MODIFIABLE ICI)
    // -------------------------------------------------------------
    const COMPTES = [
        { nom: "Compte Principal", pass: "1234" },
        { nom: "Compte Secondaire", pass: "5678" }
    ];

    // Endpoint Cloud (Bases de données synchronisées)
    const ENDPOINT = "https://api.counterapi.dev/v1/garage_dimitri_v2_data/data";

    let compteActuel = null;
    let factures = [];

    // Remplissage de la liste déroulante
    const select = document.getElementById('selectCompte');
    COMPTES.forEach((c, index) => {
        const opt = document.createElement('option');
        opt.value = index;
        opt.textContent = c.nom;
        select.appendChild(opt);
    });

    // Connexion
    document.getElementById('btnLogin').addEventListener('click', () => {
        const indexSelected = select.value;
        const passEntered = document.getElementById('inputPass').value;
        const targetCompte = COMPTES[indexSelected];
        const statusMsg = document.getElementById('statusMsg');

        if (passEntered === targetCompte.pass) {
            compteActuel = targetCompte.nom;
            statusMsg.innerHTML = `<span class="status-badge status-ok"><i class="fa-solid fa-circle-check"></i> Connecté à ${compteActuel}</span>`;
            document.getElementById('appContent').style.display = 'flex';
            chargerDonnees();
        } else {
            statusMsg.innerHTML = `<span class="status-badge status-err"><i class="fa-solid fa-triangle-exclamation"></i> Mot de passe incorrect</span>`;
        }
    });

    // Chargement des factures (Cloud ou mémoire locale)
    async function chargerDonnees() {
        const keyLocal = `factures_${compteActuel}`;
        try {
            const res = await fetch(`https://kvdb.io/4y91pYpW9M4mN9L4v5g4mX/${encodeURIComponent(compteActuel)}?t=` + Date.now());
            if (res.ok) {
                const data = await res.json();
                factures = Array.isArray(data) ? data : [];
                localStorage.setItem(keyLocal, JSON.stringify(factures));
            } else {
                recupererLocal(keyLocal);
            }
        } catch (e) {
            recupererLocal(keyLocal);
        }
        afficher();
    }

    function recupererLocal(key) {
        const local = localStorage.getItem(key);
        factures = local ? JSON.parse(local) : [];
    }

    // Sauvegarde des factures
    async function sauvegarder() {
        afficher();
        const keyLocal = `factures_${compteActuel}`;
        localStorage.setItem(keyLocal, JSON.stringify(factures));

        try {
            await fetch(`https://kvdb.io/4y91pYpW9M4mN9L4v5g4mX/${encodeURIComponent(compteActuel)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(factures)
            });
        } catch (e) {
            // Ignorer si échec réseau, la version locale reste sauvegardée
        }
    }

    // Affichage dans le tableau
    function afficher() {
        const body = document.getElementById('tableauBody');
        body.innerHTML = '';
        let totalP = 0;

        factures.forEach((f, index) => {
            totalP += parseFloat(f.montant) || 0;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${f.libelle}</td>
                <td style="color:var(--success); font-weight:600;">${parseFloat(f.montant).toFixed(2)} €</td>
                <td>${parseFloat(f.km).toFixed(1)} km</td>
                <td><button class="btn-del" onclick="supprimer(${index})"><i class="fa-solid fa-trash"></i></button></td>
            `;
            body.appendChild(tr);
        });

        document.getElementById('totalPrix').textContent = totalP.toFixed(2) + " €";

        if (factures.length > 0) {
            const derniereFacture = factures[factures.length - 1];
            const dernierKmVal = parseFloat(derniereFacture.km) || 0;
            document.getElementById('dernierKm').textContent = dernierKmVal.toFixed(1) + " km";
        } else {
            document.getElementById('dernierKm').textContent = "0.0 km";
        }
    }

    document.getElementById('factureForm').addEventListener('submit', (e) => {
        e.preventDefault();
        factures.push({
            libelle: document.getElementById('libelle').value,
            montant: document.getElementById('montant').value,
            km: document.getElementById('km').value
        });
        sauvegarder();
        e.target.reset();
    });

    function supprimer(index) {
        factures.splice(index, 1);
        sauvegarder();
    }
</script>

</body>
</html>
